  - id: debateherofficial-never-forget-that-humanity-invented-a
    quote: "Never forget that humanity invented a fake resource and then let a tiny portion of the population use that fake resource to claim ownership of all of the real resources on the planet, hoard them, and then force the majority of people to sell the majority of their lives in service to them, and in return the masses might be given enough of the actual resources they need to survive. And yet the people continue to go along with this, they keep pretending the fake resource is real. They've been successfully trained and gaslit into believing that the world could not function any other way. Programmed so thoroughly over multiple generations that the majority of people won't even question whether or not the world could or should be different. They don't realize that war is being waged against them. They no longer realize that they are slaves and anytime you try to tell them they just parrot the programming they've been fed their whole lives."
