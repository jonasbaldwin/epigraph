  - id: heidi-prieb-to-lobe
    quote: "To love someone long-term is to attend a thousand funerals of the people they used to be. The people they’re too exhausted to be any longer.\nThe people they don’t recognise inside themselves anymore. The people they grew out of, the people they never ended up growing into.\nWe so badly want the people we love to get their spark back when it burns out; to become speedily found when they are lost. \nBut it is not our job to hold anyone accountable to the people they used to be. It is our job to travel with them between each version and to honour what emerges along the way. \nSometimes it will be an even more luminescent flame. Sometimes it will be a flicker that disappears and temporarily floods the room with a perfect and necessary darkness. —Heidi Priebe,"
    enabled: true
